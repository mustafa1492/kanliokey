<!doctype html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kanlı Okey</title>
<meta name="description" content="Kanlı Okey: arkadaşlarınla telefondan oynanan dört kişilik yöresel okey. Oda kur, kodu paylaş, masaya otur.">
<meta name="theme-color" content="#150b0a">
<meta name="claude:viewport-fit-sides" content="cover">
<!--@HEAD@-->
<style>:root{color-scheme:dark}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: üstte afiş başlığı, ortada yeşil çuha masa (gösterge, deste, yan taşı), rakipler iki sütun, altta ahşap ıstaka ve eylem düğmeleri. */
:root{
  --bg:#e9ece5;--panel:#f8f9f5;--fg:#16201a;--mut:#5a665e;--line:#cfd5cb;
  --blood:#b3202a;--blood-fg:#ffffff;--gold:#d9a521;
  --felt:#1f5a3f;--felt-deep:#174732;--felt-fg:#eef6f0;--felt-line:#3f8062;
  --wood:#7a5233;--fl1:#e4e6e8;--fl2:#b4b9be;--grout:#00000022;--wood-deep:#5e3d24;--wood-line:#9a6d46;
  --tile:#f7f1df;--tile-line:#c9bf9f;--t-red:#c4221b;--t-yel:#a86a00;--t-blu:#1b57c4;--t-blk:#1d1f1e;
  --t3d:0 2px 0 #d3c8a2,0 4px 0 #b5a97f,0 5px 0 #a59a72,0 6px 5px #0006;--t3d-s:0 2px 0 #c1b58b,0 3px 0 #a99e76,0 4px 3px #0006;
  --display:"Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1511;--panel:#16201a;--fg:#e8eee9;--mut:#9aa89e;--line:#2a372f;
  --blood:#e0434d;--blood-fg:#10100f;--gold:#e8b93a;
  --felt:#14412e;--felt-deep:#0f3323;--felt-fg:#e6f0e8;--felt-line:#2f6a50;
  --wood:#4a3220;--fl1:#2d353b;--fl2:#161b1f;--grout:#0000008c;--wood-deep:#38251a;--wood-line:#6a4a30;
  --tile:#efe8d2;--tile-line:#a39a7c;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1511;--panel:#16201a;--fg:#e8eee9;--mut:#9aa89e;--line:#2a372f;
  --blood:#e0434d;--blood-fg:#10100f;--gold:#e8b93a;
  --felt:#14412e;--felt-deep:#0f3323;--felt-fg:#e6f0e8;--felt-line:#2f6a50;
  --wood:#4a3220;--fl1:#2d353b;--fl2:#161b1f;--grout:#0000008c;--wood-deep:#38251a;--wood-line:#6a4a30;
  --tile:#efe8d2;--tile-line:#a39a7c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:720px;margin:0 auto;display:grid;gap:12px}
:focus-visible{outline:3px solid var(--blood);outline-offset:2px}
h1{font:700 clamp(28px,8vw,44px)/1 var(--display);text-transform:uppercase;margin:0;letter-spacing:.01em}
h1 .bleed{color:var(--blood)}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 11px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;padding:6px 8px;border-radius:4px;border:1px solid var(--line);color:var(--mut);background:var(--panel)}
.chip.hot{background:var(--blood);color:var(--blood-fg);border-color:var(--blood)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
h2{font:700 24px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0 0 12px}
small,.mut{color:var(--mut)}
/* butonlar */
button,input,select{font:inherit;border-radius:6px;border:1px solid var(--line);padding:10px 14px;background:var(--panel);color:var(--fg);min-height:44px}
button{cursor:pointer;font-weight:600}
button:hover:not(:disabled){border-color:var(--mut)}
button.p{background:var(--blood);color:var(--blood-fg);border-color:var(--blood);font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
button.p:hover:not(:disabled){filter:brightness(1.08);border-color:var(--blood)}
button:disabled{opacity:.38;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* taşlar */
.t{position:relative;width:36px;height:50px;border-radius:6px;background:var(--tile);border:1px solid var(--tile-line);box-shadow:var(--t3d);margin-bottom:5px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font:700 21px/1 var(--display);flex:none;color:var(--t-blk);user-select:none}
.t::after{content:"";display:block;width:.32em;height:.32em;border-radius:50%;background:currentColor;opacity:.9;margin-top:.16em;box-shadow:0 1px 0 #fff9}
.t.e::before,.t.e::after,.t.ok::after,.t.st::after{display:none}
.t i{width:6px;height:6px;border-radius:50%;background:currentColor;margin-top:4px}
.c0{color:var(--t-red)}.c1{color:var(--t-yel)}.c2{color:var(--t-blu)}.c3{color:var(--t-blk)}
.t.ok{box-shadow:0 0 0 2px var(--gold),var(--t3d)}
.t.e{background:transparent;border:1px dashed var(--felt-line);box-shadow:none}
.t.ag{box-shadow:0 0 0 2px #7bd88f,var(--t3d)}
.t.sel{transform:translateY(-10px);box-shadow:0 0 0 2px var(--blood),var(--t3d)}
.mini .t,.sm-t .t{width:24px;height:34px;font-size:15px;border-radius:4px;box-shadow:var(--t3d-s);margin-bottom:4px}
.mini .t i{width:4px;height:4px;margin-top:2px}
.mini{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px}
/* masa */
.lab{font:600 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.scene{position:relative;overflow:hidden;border-radius:18px;padding:10px 8px 14px;color:var(--felt-fg);border:1px solid #0005;
  background:repeating-linear-gradient(0deg,var(--grout) 0 2px,transparent 2px 76px),repeating-linear-gradient(90deg,var(--grout) 0 2px,transparent 2px 76px),radial-gradient(80% 60% at 50% 38%,var(--fl1),var(--fl2));box-shadow:inset 0 0 30px #0005}
.board{position:relative;z-index:2;max-width:min(100%,520px);margin:0 auto}
.pile>.lab{margin-bottom:20px}
.felt3d{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.618fr) minmax(0,1fr);grid-template-rows:minmax(84px,auto) minmax(150px,1fr) minmax(84px,auto);aspect-ratio:1/1.272;grid-template-areas:"top top top" "left mid right" "me me me";gap:8px;padding:13px 8px;border-radius:28px;border:11px solid transparent;
  background:radial-gradient(90% 75% at 50% 42%,#2f8058 0%,var(--felt) 46%,var(--felt-deep) 100%) padding-box,linear-gradient(135deg,#f3f5f6 0%,#a7adb2 22%,#6f767c 46%,#c9ced2 70%,#8b9298 100%) border-box;
  box-shadow:inset 0 0 0 3px #1a110a,inset 0 0 0 7px #8a5d38,inset 0 0 0 8px #3b2414,inset 0 0 28px #000a,0 3px 0 #44494d,0 6px 0 #2f3336,0 14px 14px -8px #000c;color:var(--felt-fg)}
.felt3d::before{content:"";position:absolute;inset:0;border-radius:18px;pointer-events:none;background:radial-gradient(70% 55% at 50% 30%,#ffe9a81f,transparent 70%)}
@keyframes steam{0%{opacity:0;transform:translateY(3px)}30%{opacity:.5}100%{opacity:0;transform:translateY(-6px)}}
.plate{position:relative}
.penbtn{margin-left:auto;min-height:34px;padding:4px 12px;font:700 12px/1 var(--display);letter-spacing:.14em;text-transform:uppercase}
.gstat{position:relative;padding:10px 12px}
.gstat .status b{font-size:15px;line-height:1.25;flex:1 1 100px}
.gstat .penbtn{flex:none}
.gstat .tag{padding:6px 8px;font-size:12px}
.penpanel{position:absolute;top:calc(100% + 6px);right:0;z-index:30;width:min(240px,100%);background:#0d1410f2;border:1px solid #ffffff30;border-radius:10px;padding:12px;box-shadow:0 10px 24px #000c;color:#f5e6c4}
.penpanel h3{margin:0 0 8px;font:700 16px/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.penpanel .pr{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid #ffffff22;font-variant-numeric:tabular-nums}
.penpanel .pr b{font:700 18px/1 var(--display)}
.penpanel .pr.top b{color:#ff7a82}
.penpanel small{display:block;color:#f5e6c4aa;font-size:11px}
.area{min-width:0}
.a-top{grid-area:top;align-self:start}.a-left{grid-area:left;align-self:center;justify-self:start}.a-right{grid-area:right;align-self:center;justify-self:end}.a-me{grid-area:me;align-self:end}
.a-mid{grid-area:mid;display:grid;gap:8px;align-content:center;align-self:center;justify-items:center;position:relative}
.a-mid>*{position:relative;z-index:1}
.pile::before{content:"";position:absolute;left:50%;top:calc(100% - 24px);width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:radial-gradient(circle,#0d0d0e 0 46%,#26262a 47% 54%,transparent 55%),conic-gradient(#efe6cb,#b3202a,#f6eed4,#7d1119,#efe6cb);box-shadow:0 3px 8px #000a,inset 0 0 0 2px #0008;opacity:.9;z-index:0}
.a-mid::after{position:absolute;left:0;right:0;bottom:-6px;text-align:center;font:700 11px/1 var(--display);letter-spacing:.2em;text-transform:uppercase;color:#f5dca0;text-shadow:0 1px 3px #000;z-index:2}
.okeyrow{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 12px}
.okeyrow .grp{display:grid;justify-items:center;gap:4px}
.a-mid .lab{font-size:10px}
.a-mid .t{width:25px;height:35px;font-size:14px}
.pile{display:grid;gap:6px;justify-items:center;position:relative}
.pile>*{position:relative;z-index:1}
.pilebtn{padding:0;border:0;background:none;min-height:0;color:inherit;display:block;border-radius:6px}
.pilebtn:disabled{opacity:1}
.pilebtn:hover:not(:disabled){filter:brightness(1.1)}
.pilebtn:focus-visible{outline-color:var(--gold)}
.back{width:34px;height:47px;border-radius:6px;border:1px solid var(--felt-line);background:repeating-linear-gradient(45deg,var(--felt-deep) 0 6px,var(--felt) 6px 12px);box-shadow:3px 3px 0 var(--felt-deep),0 0 0 3px var(--felt-fg);display:flex;align-items:center;justify-content:center;font:700 18px/1 var(--display);color:var(--felt-fg);text-shadow:0 1px 3px #000a}
.pilebtn.live .back{outline:3px solid var(--gold);outline-offset:5px}
.seat{display:grid;gap:4px;justify-items:center;align-content:start;padding:4px 2px;border-radius:12px;border:1px solid transparent;min-width:0}
.seat.turn .plate{box-shadow:0 0 0 2px var(--gold),0 0 12px #e8b93a99;background:#e8b93a33}
.plate{display:flex;align-items:center;gap:6px;background:#0000004d;border:1px solid var(--felt-line);border-radius:999px;padding:4px 10px 4px 4px;max-width:100%;min-width:0}
.av{width:26px;height:26px;border-radius:50%;background:var(--gold);color:#1a1405;font:700 15px/26px var(--display);text-align:center;flex:none}
.pn{min-width:0;text-align:left}
.pn b{display:block;font:700 14px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em;overflow-wrap:break-word}
.pn em{font:600 10px/1 var(--body);letter-spacing:.1em;font-style:normal;color:var(--gold);margin-left:4px}
.pn small{display:block;opacity:.85;font-size:11px;line-height:1.25;font-variant-numeric:tabular-nums}
.backs{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:100%}
.backs i{width:9px;height:14px;border-radius:2px;background:repeating-linear-gradient(45deg,var(--felt-deep) 0 3px,var(--felt) 3px 6px);border:1px solid var(--felt-line)}
.dpile{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:3px;max-width:100%;min-height:30px}
.dpile .t{width:22px;height:30px;font-size:14px;border-radius:4px;box-shadow:var(--t3d-s);margin-bottom:2px;transform:rotate(var(--r))}
.dpile .t i{width:4px;height:4px;margin-top:2px}
.dpile .pilebtn.live .t{outline:2px solid var(--gold);outline-offset:2px;transform:rotate(var(--r)) scale(1.18)}
.more{font:600 11px/1 var(--body);opacity:.8}
.none{font-size:11px;opacity:.6}
.orow{display:grid;gap:2px;padding-top:8px;margin-top:8px;border-top:1px solid var(--line)}
.orow:first-of-type{border-top:0;margin-top:0;padding-top:0}
.rlabel{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pbadge{font:600 12px/1 var(--body);letter-spacing:.06em;padding:5px 9px;border-radius:999px;background:#00000040;color:#f3e8d8;border:1px solid #ffffff22;font-variant-numeric:tabular-nums}
.pbadge b{font:700 14px/1 var(--display)}
.pbadge.go{background:#2f8a55;border-color:#7bd88f;color:#fff}
.plaque{position:absolute;top:-18px;right:12px;z-index:2;display:grid;justify-items:center;line-height:1;padding:8px 14px 9px;min-width:96px;border-radius:8px;background:linear-gradient(180deg,#f2d27a,#c99a2e);color:#2a1d05;border:1px solid #8a6a1c;box-shadow:0 3px 0 #7a5a14,0 6px 10px #0006}
.plaque.go{background:linear-gradient(180deg,#8fe0a8,#3fa862);border-color:#2a7a47;box-shadow:0 3px 0 #1f5c36,0 6px 10px #0006}
.plaque b{font:700 32px/1 var(--display);font-variant-numeric:tabular-nums;margin:3px 0}
.pl-l,.pl-s{font:600 10px/1 var(--body);letter-spacing:.12em;text-transform:uppercase}
.rackbox{position:relative;margin-top:12px}
/* durum */
.status{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.tag{font:700 13px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;padding:7px 10px;border-radius:4px;background:var(--gold);color:#1a1405}
.tag.wait{background:var(--line);color:var(--mut)}
.warn{color:var(--blood);font-weight:600;margin-top:8px}
.score{font-variant-numeric:tabular-nums;margin-top:8px}
/* ıstaka */
.rackbox{background:repeating-linear-gradient(92deg,#ffffff0a 0 3px,transparent 3px 9px),linear-gradient(180deg,var(--wood) 0%,var(--wood-deep) 100%);border:1px solid var(--wood-line);border-top:3px solid #b98a5b;border-radius:12px;padding:14px 8px 14px;display:grid;gap:12px;color:#f3e8d8;box-shadow:0 5px 0 #2a190e,0 12px 16px -6px #000b,inset 0 1px 0 #ffffff22}
.rackbox .lab{color:#f3e8d8}
.rack{--tw:min(44px,calc((100vw - 72px)/12));--th:calc(var(--tw)*1.389);display:grid;grid-template-columns:repeat(12,var(--tw));justify-content:center;gap:13px 2px;padding:14px 4px 14px;margin-top:6px;border-radius:8px;background:#00000040;box-shadow:inset 0 6px 10px #000a,inset 0 -2px 0 #ffffff14}
.rs{position:relative;width:var(--tw);height:calc(var(--th) + 4px);border-radius:4px;background:linear-gradient(180deg,#0000005c,#0000001a);box-shadow:inset 0 2px 3px #000b,0 3px 0 #d1a06a,0 5px 0 #6b4528,0 7px 0 #2a190e}
.rackbox.hot{outline:3px solid var(--gold);outline-offset:2px}
.mini.tgt{outline:2px solid var(--gold);outline-offset:1px;background:#e8b93a33;border-radius:6px}
.ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;margin:0!important;transform:translate3d(-100px,-100px,0) translate(-50%,-50%) scale(1.15);will-change:transform;box-shadow:0 8px 10px #0007}
.pilebtn{touch-action:none}
.rs.ibl::after,.rs.ibr::after{content:"";position:absolute;top:-5px;bottom:-5px;width:4px;background:var(--gold);border-radius:2px;box-shadow:0 0 8px var(--gold);z-index:6}
.rs.ibl::after{left:-3px}.rs.ibr::after{right:-3px}
.rs.over{outline:2px solid var(--gold);outline-offset:1px;background:#e8b93a55}
.rack .t{position:absolute;left:0;top:0;width:var(--tw);height:var(--th);margin:0;font-size:calc(var(--tw)*.58);cursor:grab;touch-action:none;-webkit-touch-callout:none}
.rack .t.drag,.ghost{transition:none!important}
.rack .t.drag{animation:none!important;position:fixed;left:0;top:0;z-index:50;pointer-events:none;cursor:grabbing;transform:translate3d(-100px,-100px,0) scale(1.12);will-change:transform;box-shadow:0 8px 10px #0007}
.dragging{touch-action:none}
.candrop .scene{box-shadow:inset 0 0 60px #0005,0 0 0 3px var(--gold),0 0 0 8px #e8b93a44}
.scene::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:8;box-shadow:inset 0 0 0 4px var(--gold),inset 0 0 46px #e8b93a99;opacity:0;transition:opacity .12s;will-change:opacity}
.candrop .scene.hot::before{opacity:1}
.a-me{position:relative}
.seat .pers{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:flex-start;justify-content:center;min-width:0}
.a-top .seat{grid-template-columns:auto auto;justify-content:center;align-items:center;column-gap:8px}
.a-top .plate{grid-column:1/-1;justify-self:center}
.a-top .dpile{grid-column:1;grid-row:2}
.a-top .orack{grid-column:2;grid-row:2;margin:0}
.a-top .pers{grid-column:1/-1;grid-row:3}
.a-left .seat{grid-template-columns:auto minmax(0,1fr);column-gap:4px;justify-items:stretch}
.a-left .plate{grid-column:1/-1;justify-self:center}
.a-left .orack{grid-column:1;grid-row:2;margin:0}
.a-left .pers{grid-column:2;grid-row:2;flex-direction:column;align-items:flex-start;justify-content:flex-start}
.a-left .dpile{grid-column:1/-1;grid-row:3}
.a-right .seat{grid-template-columns:minmax(0,1fr) auto;column-gap:4px;justify-items:stretch}
.a-right .plate{grid-column:1/-1;justify-self:center}
.a-right .dpile{grid-column:1/-1;grid-row:2}
.a-right .pers{grid-column:1;grid-row:3;flex-direction:column;align-items:flex-end;justify-content:flex-start}
.a-right .orack{grid-column:2;grid-row:3;margin:0}
.candrop .a-me::after{content:"↓ bırak = at";position:absolute;left:50%;bottom:2px;transform:translateX(-50%);z-index:5;pointer-events:none;white-space:nowrap;font:700 11px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:#1a1405;background:var(--gold);border-radius:999px;padding:6px 10px}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr));gap:8px}
.acts button{width:100%}
.rackbox button:not(.p){background:#00000033;color:#f3e8d8;border-color:var(--wood-line)}
.rackbox button:not(.p):hover:not(:disabled){border-color:#f3e8d8}
.hint{font-size:14px;opacity:.9}.hint summary{cursor:pointer;font-weight:600;padding:4px 0}
.acts3{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:6px}.acts3 button{min-height:46px;padding:6px 4px;font-size:16px;width:100%}
.acts3.sm{grid-template-columns:repeat(3,1fr)}.acts3.sm button{min-height:40px;font-size:14px}
.rackbox button.dim{opacity:.6}
.sgroups{display:grid;gap:6px;background:#00000033;border-radius:8px;padding:6px}
.sgroups .g{display:flex;gap:3px;align-items:center;overflow-x:auto}
.sgroups .g .t{width:26px;height:36px;font-size:15px}
.sgroups .un{flex:none;margin-left:auto;min-height:30px;padding:2px 9px;font-size:13px}
.a-left .plate,.a-right .plate{flex-direction:column;border-radius:14px;padding:6px 6px 5px;gap:3px;text-align:center}
.a-left .pn,.a-right .pn{text-align:center}
.a-me .pn b,.a-top .pn b{white-space:nowrap}
.orack{position:relative;margin:6px auto 0;flex:none}
.orack .base{position:absolute;inset:0;border-radius:4px;background:repeating-linear-gradient(92deg,#ffffff14 0 3px,transparent 3px 8px),linear-gradient(180deg,#b78754,#6e4829);box-shadow:inset 0 0 0 1px #e0b27c66,0 2px 0 #3b2414,0 4px 5px #000a}
.orack i{position:absolute;border-radius:2px;background:linear-gradient(180deg,#fffdf2,#e4d9b6);box-shadow:0 1px 0 #b3a67d,0 2px 2px #0007}
.orack.h i{top:3px;width:8px;height:12px}
.orack.v i{left:3px;width:12px;height:5px}
.pers .mini{margin:0;gap:2px;flex-wrap:wrap;background:#00000033;border-radius:5px;padding:2px 1px}
.pers .mini .t{width:15px;height:22px;font-size:10px;border-radius:3px;margin-bottom:2px}
.a-top .pers .mini .t,.a-me .pers .mini .t{width:21px;height:30px;font-size:13px}
.pers .ins{flex:none;min-height:22px;padding:1px 5px;font-size:11px}
.cloth{background:radial-gradient(90% 90% at 50% 40%,var(--felt) 0%,var(--felt-deep) 100%);color:var(--felt-fg);border:7px solid var(--wood);border-radius:14px;box-shadow:inset 0 0 28px #000a,0 5px 0 #3b2414,0 10px 14px -6px #000a}
.cloth h2{color:var(--felt-fg)}
.cloth .orow{border-top-color:var(--felt-line)}
.cloth .mini{flex-wrap:nowrap;overflow-x:auto;padding:2px 2px 4px}
.cloth .ins{flex:none}
.stage{border:1px dashed #ffffff55;background:#0000002e;border-radius:12px;padding:6px 8px;display:grid;gap:6px;box-shadow:inset 0 2px 8px #0006}
.stage.ok{border-color:#7bd88f;box-shadow:inset 0 2px 8px #0006,0 0 14px #7bd88f55}
.stage .groups{display:grid;gap:8px}
.stage .g{display:flex;gap:3px;align-items:center;flex-wrap:nowrap;overflow-x:auto;padding:2px 2px 4px}
.stage .g .t{width:30px;height:42px;font-size:18px}
.stage .g .gv{margin-left:auto;font:700 13px/1 var(--display);letter-spacing:.06em;opacity:.9;white-space:nowrap;padding-left:6px}
.stage .g .un{flex:none;min-height:30px;padding:2px 9px;font-size:13px}
.stage button:not(.p){background:#00000040;color:var(--felt-fg);border-color:#ffffff40}
.stage .srow{display:flex;gap:8px}.stage .srow button{flex:1}.stage .srow .p{flex:1.4}
.stage button.dim{opacity:.55}
.snote{font:600 13px/1.3 var(--body);color:#ffe9a8}
.calc{font:600 13px/1.3 var(--body);font-variant-numeric:tabular-nums;background:#00000040;border-radius:6px;padding:6px 10px}
.calc b{font-family:var(--display);letter-spacing:.05em;text-transform:uppercase}
.a-me .seat{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 14px;padding-inline:0}
.a-me .pers{flex:0 0 100%;order:-1}
.rack .t.pop{animation:pop .28s ease-out backwards;animation-delay:calc(0ms - var(--pe,0ms));z-index:3;box-shadow:0 0 0 3px var(--gold),var(--t3d)}
@keyframes pop{0%{transform:scale(1.14);opacity:.55}100%{transform:none;opacity:1}}
.ghost.bk{width:34px;height:47px;border-radius:6px;border:1px solid var(--felt-line);background:repeating-linear-gradient(45deg,var(--felt-deep) 0 6px,var(--felt) 6px 12px);box-shadow:0 0 0 3px #fff9,0 8px 10px #0007;font-size:0}
.pile.pulled .back{opacity:.55}
.toast.info{background:#22302a;color:#f3e8d8;border:1px solid #e8b93a88;box-shadow:0 6px 14px #0006;font-weight:500}
.toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:80;width:min(92vw,420px);padding:12px 14px;border-radius:10px;background:var(--blood);color:var(--blood-fg);font:600 15px/1.3 var(--body);box-shadow:0 6px 14px #0007;animation:toast 5.2s both;cursor:pointer}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-12px)}5%{opacity:1;transform:translate(-50%,0)}90%{opacity:1}100%{opacity:0;pointer-events:none}}

.sinking .rack .t:not(.drag),.sinking .tl i,.sinking .dpile .t,.sinking .cloth .t,.sinking .a-mid .t,.sinking .pers .t,.sinking .orack i{animation:sink .6s ease-in both;animation-delay:calc(var(--d,0ms) - var(--el,0ms))}
.sinking:not(.final) .felt3d{animation:hum .22s linear 20 both;animation-delay:calc(1500ms - var(--el,0ms))}
.sinking:not(.final) .pile::before{animation:spin 1.1s linear infinite;animation-delay:calc(1300ms - var(--el,0ms))}
.dealing .rack .t:not(.drag),.dealing .tl i,.dealing .a-mid .t,.dealing .a-mid .back{animation:rise .5s cubic-bezier(.2,.9,.3,1.15) both;animation-delay:calc(var(--d,0ms) - var(--el,0ms))}
.dealing .pile::before{animation:spin .9s ease-out 1 both;animation-delay:calc(0ms - var(--el,0ms))}
}
@keyframes chaosio{0%{opacity:0}7%{opacity:1}90%{opacity:1}100%{opacity:0}}
@keyframes chaosmv{from{transform:translate(var(--x1),var(--y1)) rotate(var(--r1))}to{transform:translate(var(--x2),var(--y2)) rotate(var(--r2))}}
.chaos{display:none;position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden;border-radius:18px}
.sinking:not(.final) .chaos{display:block;animation:chaosio 5.4s both;animation-delay:calc(1000ms - var(--el,0ms))}
.chaos .t{position:absolute;left:50%;top:50%;margin:-15px 0 0 -11px;width:22px;height:30px;font-size:13px;border-radius:4px;animation:chaosmv var(--t,.6s) ease-in-out infinite alternate;animation-delay:calc(0ms - var(--el,0ms))}
@media (prefers-reduced-motion:reduce){.chaos{display:none!important}}
@media (prefers-reduced-motion:reduce){.sinking .rack .t,.sinking .tl i,.sinking .dpile .t,.sinking .cloth .t,.sinking .a-mid .t{opacity:0}}
.sinking:not(.final) .a-mid::after{content:"Taşlar karılıyor…"}
.dealing .a-mid::after{content:"Taşlar dağıtılıyor…"}
@keyframes sink{to{transform:translateY(12px) scale(.3);opacity:0}}
@keyframes rise{from{transform:translateY(28px) scale(.55);opacity:0}to{transform:none;opacity:1}}
@keyframes hum{0%,100%{transform:none}25%{transform:translate(-1.5px,1px)}75%{transform:translate(1.5px,-1px)}}
@keyframes spin{to{transform:rotate(360deg)}}
/* salon */
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px;margin-bottom:14px}
.slot{min-width:0;border:1px solid var(--line);border-radius:8px;padding:12px;font:700 18px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em;overflow-wrap:anywhere}
.slot.empty{border-style:dashed;color:var(--mut);font-weight:500}
.slot small{display:block;font:600 11px/1 var(--body);letter-spacing:.12em;margin-bottom:6px}
.slot.bot{background:var(--bg);border-style:solid}
.form{display:grid;gap:10px}
.form input,.form select{min-width:0;flex:1 1 140px}
.res{display:grid;gap:6px;margin-top:10px}
.res div{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:6px;font-variant-numeric:tabular-nums}
.ins{min-height:34px;padding:4px 10px;font-size:13px;background:var(--gold);color:#1a1405;border-color:var(--gold)}
.grow{align-items:center}
.code{font:700 44px/1 var(--display);letter-spacing:.22em;margin:4px 0 12px;user-select:all}
.ar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.ar small{display:block}
.danger{background:var(--blood);color:#fff;border-color:var(--blood)}
.hr{border:0;border-top:1px solid var(--line);margin:6px 0;width:100%}
@media (prefers-reduced-motion:no-preference){.t{transition:transform .12s}.seat{transition:box-shadow .2s}}

/* ana ekran teması */
.agate{justify-self:center;color:#cfe0d4;font:600 12px/1 var(--body);letter-spacing:.06em}.agate summary{cursor:pointer;padding:10px;text-align:center}.agate .row{margin-top:6px}
body.lobby #app{display:grid;gap:12px}
body.lobby{background-color:#0b2f22;background:radial-gradient(120% 80% at 50% 0%,#2a8a5f 0,#14503a 45%,#0b2f22 100%);color:#f3e8d8}
body.lobby .wrap{position:relative}
body.lobby h1{color:#f6eed4}body.lobby h1 .bleed{color:#e0242f}
body.lobby .panel{background:#f6f1e3;color:#1a1a18;border-color:#0004}
body.lobby .panel .mut,body.lobby .panel small{color:#5b564a}
.lobby-hero{display:grid;grid-template-columns:minmax(96px,1fr) minmax(0,1.618fr);gap:16px;align-items:center;padding:6px 2px}
.lhero{width:100%;height:auto;}
.lobby-hero .kick{font:600 11px/1 var(--body);letter-spacing:.14em;color:#e8b93a}
.lobby-hero .lh{font:700 24px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:8px 0;color:#f6eed4}
.lobby-hero p{margin:0 0 10px;color:#d8e8dc}
.pills{display:flex;flex-wrap:wrap;gap:6px}.pills span{font:600 11px/1 var(--body);padding:6px 9px;border-radius:999px;background:#0000004d;border:1px solid #ffffff2a;color:#f3e8d8}
.flab{display:block;font:600 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:#5b564a;margin-bottom:8px}
.lobby-card input{width:100%}
.lobby-opts{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.lobby-opts{grid-template-columns:1fr 1fr}}
.opt{position:relative;display:grid;gap:10px;align-content:start}.opt h2{margin:0}.opt p{margin:0}
.opt .ob{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;background:#e8b93a;color:#1a1a18;font:700 14px/26px var(--display);text-align:center}
.resume{width:100%}
.lsteps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;list-style:none;margin:0;padding:0;counter-reset:s}
.lsteps li{counter-increment:s;background:#0000004d;border:1px solid #ffffff22;border-radius:10px;padding:10px;display:grid;gap:3px;color:#f3e8d8}
.lsteps li::before{content:counter(s);font:700 18px/1 var(--display);color:#e8b93a}
.lsteps b{font:700 15px/1.1 var(--display);text-transform:uppercase}.lsteps span{font-size:12px;color:#cfe0d4;line-height:1.3}
.lrules{justify-self:center;color:#f3e8d8;font:600 13px/1 var(--body);letter-spacing:.06em;text-decoration:underline;text-underline-offset:4px;padding:10px}
body.lobby .warn{margin:0}

.sec{display:contents}
.ann{background:#22302a;color:#f3e8d8;border:1px solid #e8b93a88;border-radius:10px;padding:10px 12px;font:500 14px/1.35 var(--body)}
.ann b{color:#e8b93a;font:700 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;margin-right:8px}
.seg{display:flex;gap:6px;margin-top:6px}.seg button{flex:1}
.wr{border-top:1px solid var(--line);padding:10px 0}.wr.turn{background:#e8b93a1a}
.wh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}.wh small{flex:1 1 100%}
.wr .mini{margin-top:6px}.wr .mini .t{width:20px;height:28px;font-size:13px;margin-bottom:3px}
.hist{margin-top:10px;display:grid;gap:6px}.hr2{display:flex;flex-wrap:wrap;gap:4px 12px;border-top:1px solid var(--line);padding-top:6px;font-size:13px}.hr2 small{flex:1 1 100%}.hr2 .lose{color:var(--blood)}
.note{margin-top:8px;font-weight:600;color:#1f7a4a}

.bleed{position:relative;display:inline-block;text-shadow:0 2px 0 #4a0710}
.bleed::after{content:"";position:absolute;left:0;right:0;top:96%;height:.72em;background:var(--drip) repeat-x top left/2.3em .72em;transform-origin:top;animation:drip 1.8s cubic-bezier(.3,.8,.3,1) both;pointer-events:none}
@keyframes drip{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media(prefers-reduced-motion:reduce){.bleed::after{animation:none}}
.top h1{padding-bottom:.5em}
.opt::before,.gstat::before,.lobby-card::before{content:"";position:absolute;left:10px;right:10px;top:-1px;height:25px;background:var(--drip) repeat-x top left/80px 25px;pointer-events:none}
.gstat,.lobby-card{position:relative}
.lobby-hero{position:relative}
.lobby-hero::after{content:"";position:absolute;left:84px;bottom:-4px;width:58px;height:58px;background:var(--splat) no-repeat center/contain;opacity:.5;pointer-events:none}
.toast.info{border-left:4px solid #c1121f}
.toast.info::after{content:"";position:absolute;left:14px;right:14px;top:calc(100% - 1px);height:20px;background:var(--drip) repeat-x top left/64px 20px;pointer-events:none}
.penpanel::before{content:"";position:absolute;left:8px;right:8px;top:-1px;height:20px;background:var(--drip) repeat-x top left/64px 20px;pointer-events:none}
.penpanel h3{padding-top:14px}
.penpanel .pr.top{color:#ff6b6b}

.tmr{position:relative;height:22px;margin-top:10px;border-radius:999px;background:#22302a;overflow:hidden}
.tmr i{position:absolute;inset:0;transform-origin:left;background:linear-gradient(90deg,#2f8a55,#e8b93a);transition:transform .5s linear;will-change:transform}
.tmr.low i{background:linear-gradient(90deg,#8f0b18,#c1121f)}
.tmr span{position:relative;display:block;text-align:right;padding:0 10px;font:700 13px/22px var(--body);font-variant-numeric:tabular-nums;color:#fff;letter-spacing:.04em}
.gstat{padding-top:26px}.gstat::before{height:20px;background-size:64px 20px}
.opt,.lobby-card{padding-top:30px}

.bleed::after{left:-.05em;right:-.3em;height:1.2em;background:var(--dripT) no-repeat top left/3.8em 1.14em}
.top h1{padding-bottom:.7em}
.opt::before,.gstat::before,.lobby-card::before{left:0;right:0;top:-1px;height:34px;background:var(--dripU) no-repeat top left/520px 34px}
.opt+.opt::before{background-position:-140px 0}.lobby-card::before{background-position:-60px 0}
.gstat{padding-top:30px}
.toast.info::after{left:8px;right:8px;height:34px;background:var(--dripU) no-repeat top left/520px 34px}
.penpanel::before{left:0;right:0;height:34px;background:var(--dripU) no-repeat top left/520px 34px;background-position:-120px 0}

/* ===== v35: koyu, sıcak "kanlı" hava ===== */
html:root,html:root[data-theme]{color-scheme:dark;
  --bg:#0b0707;--panel:#1a1211;--fg:#f1e7d8;--mut:#b09f8d;--line:#3a2a25;
  --blood:#cf2431;--blood-fg:#ffffff;--gold:#e8b93a;
  --felt:#18533b;--felt-deep:#0c3225;--felt-fg:#ecf4ee;--felt-line:#2f6a50;
  --wood:#523523;--wood-deep:#331f15;--wood-line:#74502f;
  --fl1:#2b1e1a;--fl2:#0e0908;--grout:#00000070;
  --tile:#f6efdb;--tile-line:#b9ad8a;--t-red:#d3241b;--t-yel:#c27600;--t-blu:#1b54d6;--t-blk:#1b1b1b}
html{background:#080505}
body{background:radial-gradient(130% 70% at 50% -8%,#33100f 0%,#150b0a 46%,#080505 100%);min-height:100vh}
.panel,.gstat{background:linear-gradient(180deg,#1f1513,#170f0e);border-color:#3f2c26}
.chip{background:#1a1211;border-color:#3f2c26}
.chip.tg{cursor:pointer;min-height:34px;padding:6px 9px;font:600 11px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--fg)}
.chip.tg[aria-pressed="false"]{opacity:.55;text-decoration:line-through}
.scene{background:repeating-linear-gradient(0deg,var(--grout) 0 2px,transparent 2px 76px),repeating-linear-gradient(90deg,var(--grout) 0 2px,transparent 2px 76px),radial-gradient(70% 55% at 50% 100%,#4a0f12aa,transparent 70%),radial-gradient(80% 60% at 50% 38%,var(--fl1),var(--fl2));border-color:#000;box-shadow:inset 0 0 40px #000a}
/* masa: koyu çelik çerçeve + bordo iç çerçeve + keçe dokusu */
.felt3d{background:radial-gradient(#ffffff0a 1px,transparent 1.2px) 0 0/4px 4px padding-box,radial-gradient(90% 75% at 50% 42%,var(--felt-hi,#27774f) 0%,var(--felt) 46%,var(--felt-deep) 100%) padding-box,linear-gradient(135deg,#5b5351 0%,#201918 26%,#463d3a 50%,#130e0e 76%,#2e2524 100%) border-box;
  box-shadow:inset 0 0 0 3px #090404,inset 0 0 0 7px #84131b,inset 0 0 0 8px #2a0508,inset 0 0 36px #000c,0 3px 0 #1d1716,0 6px 0 #0e0b0b,0 16px 20px -8px #000f}
.area{position:relative;z-index:1}
/* masa damgası */
.stamp{position:absolute;left:50%;top:50%;width:82%;height:auto;transform:translate(-50%,-50%) rotate(-7deg);color:#9c1119;opacity:.3;pointer-events:none;z-index:0;overflow:visible}
/* taşlar: daha büyük rakam, parlak yüz, kabartma */
.t{background:linear-gradient(165deg,#fffcf3 0%,var(--tile) 52%,#e3d8b5 100%);box-shadow:var(--t3d),inset 0 1px 0 #fff,inset 0 -3px 4px #0000001f;text-shadow:0 1px 0 #fffc}
.t.ok,.t.sel,.t.ag{box-shadow:0 0 0 2px var(--gold),var(--t3d)}
.t.sel{box-shadow:0 0 0 2px var(--blood),var(--t3d)}.t.ag{box-shadow:0 0 0 2px #7bd88f,var(--t3d)}
.rack .t{font-size:calc(var(--tw)*.7)}
.mini .t{font-size:17px}.dpile .t{font-size:16px}
.pers .mini .t{font-size:13px}.a-top .pers .mini .t,.a-me .pers .mini .t{font-size:16px}
/* atılan taş yığını: eski taşlar eğik ve soluk, son taş net */
.dstack{position:relative;display:grid;place-items:center;width:42px;height:44px}
.dstack>*{grid-area:1/1}
.dstack .t.old{margin:0;filter:brightness(.55) saturate(.75);opacity:.95;transform:translate(var(--ox),var(--oy)) rotate(var(--or));box-shadow:0 1px 0 #0009,0 2px 3px #0007;pointer-events:none}
.dstack .t.old::after{display:none}
.dstack .pilebtn,.dstack>.t{z-index:2}
.dstack>.t{margin:0}
.dstack .pilebtn .t{margin:0}
.t.dnew{animation:land .5s cubic-bezier(.2,.9,.3,1.2) backwards;animation-delay:calc(0ms - var(--pe,0ms))}
.t.dnew::before{content:"";position:absolute;inset:-4px;border-radius:8px;border:2px solid #ffd36a;pointer-events:none;animation:dring 1s ease-out both;animation-delay:calc(0ms - var(--pe,0ms))}
@keyframes land{0%{transform:translateY(-24px) scale(1.5) rotate(calc(var(--r)*3));opacity:.3}55%{transform:translateY(1px) scale(.94) rotate(var(--r));opacity:1}100%{transform:rotate(var(--r))}}
@keyframes dring{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
/* sıra halkası */
.av{position:relative}
.seat.turn .av::before{content:"";position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(var(--ringc,var(--gold)) var(--p,360deg),#ffffff22 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 3px))}
.seat.turn .av.low{--ringc:#ff4a55}
/* ceza anı: ekran kenarından kan akışı */
.scene.pflash::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:9;border-radius:inherit;background:var(--dripT) no-repeat top center/100% auto,radial-gradient(120% 90% at 50% 40%,transparent 52%,#a1141ccc 100%);animation:pflash 1.2s ease-out both;animation-delay:calc(0ms - var(--pe,0ms))}
@keyframes pflash{0%{opacity:0}10%{opacity:1}65%{opacity:.9}100%{opacity:0}}
/* bilgisayar: solda masa, sağda durum + ıstaka (kaydırmadan hepsi görünsün) */
@media (min-width:1000px){
  .wrap{max-width:1180px}
  #app.gm{display:grid;grid-template-columns:minmax(0,540px) minmax(0,560px);gap:14px 26px;justify-content:center;align-items:start;grid-template-rows:auto auto auto 1fr}
  #app.gm>.sec{display:grid;gap:12px;align-content:start}
  #app.gm>.sec:nth-child(1){grid-column:1/-1}
  #app.gm>.sec:nth-child(2){grid-column:2;grid-row:2}
  #app.gm>.sec:nth-child(3){grid-column:1;grid-row:2/5}
  #app.gm>.sec:nth-child(4){grid-column:2;grid-row:3}
  #app.gm>.sec:nth-child(5){grid-column:2;grid-row:4}
  .board{max-width:540px}
  .rackbox{margin-top:0}
  .rack{--tw:clamp(28px,calc((min(100vw,1180px) - 32px - 540px - 26px - 62px)/12),44px)}
}

.dealing .gf .t::before{content:"";position:absolute;inset:-1px;border-radius:inherit;background:repeating-linear-gradient(45deg,#6e1218 0 4px,#4e0b10 4px 8px);box-shadow:inset 0 0 0 2px #f3ead6;animation:gback .7s step-end both;animation-delay:calc(1450ms - var(--el,0ms));z-index:2}

  const BUF={},lastPick={},SG={tick:1.5,swap:1,turn:1.35,penalty:1.5,win:1.4,lose:1.4,deckend:1.4,drop:1.15,discard:1.2},JIT={pick:1,drop:1,draw:1,discard:1,place:1,tick:1};
  try{snd=localStorage.getItem('ko_snd')!=='0';vb=localStorage.getItem('ko_vib')!=='0'}catch(e){}
  const AC=typeof window!=='undefined'&&(window.AudioContext||window.webkitAudioContext);
  function init(){
    if(!AC)return null;
    if(!ctx){
      try{
        ctx=new AC();out=ctx.createGain();out.gain.value=2.2;
        const cp=ctx.createDynamicsCompressor();cp.threshold.value=-14;cp.ratio.value=5;
        out.connect(cp);cp.connect(ctx.destination);
        sout=ctx.createGain();sout.gain.value=VOL;sout.connect(ctx.destination);
        nb=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
        const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      }catch(e){ctx=null;return null}
    }
    if(ctx.state==='suspended')ctx.resume().catch(()=>{});
    loadSamples();
    return ctx;
  }
  /* gömülü kayıtları çöz; çözülemezse sentez sesler devreye girer */
  function loadSamples(){
    if(loading||!ctx||typeof SND_DATA==='undefined')return;
    loading=true;
    const dec=ab=>new Promise((ok,no)=>{try{const p=ctx.decodeAudioData(ab,ok,no);if(p&&p.catch)p.catch(no)}catch(e){no(e)}});
    for(const n in SND_DATA){
      BUF[n]=[];
      SND_DATA[n].forEach(b64=>{try{const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);dec(u.buffer).then(b=>BUF[n].push(b)).catch(()=>{})}catch(e){}});
    }
  }
  function samp(t,n,v){
    const a=BUF[n];if(!a||!a.length)return false;
    let i=Math.floor(Math.random()*a.length);if(a.length>1&&i===lastPick[n])i=(i+1)%a.length;lastPick[n]=i;
    const s=ctx.createBufferSource();s.buffer=a[i];if(JIT[n])s.playbackRate.value=.96+Math.random()*.08;
    const g=ctx.createGain();g.gain.value=(SG[n]||1)*(v||1);s.connect(g);g.connect(sout);s.start(t);return true;
  }
  /* gürültü darbesi: filtreli, zarflı */
  function nz(t,dur,o){
    const s=ctx.createBufferSource();s.buffer=nb;s.loop=true;
    const f=ctx.createBiquadFilter();f.type=o.type||'bandpass';f.Q.value=o.q||1;
    f.frequency.setValueAtTime(o.f,t);if(o.to)f.frequency.exponentialRampToValueAtTime(o.to,t+dur);
    const g=ctx.createGain();g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(o.g,t+(o.a||.004));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f);f.connect(g);g.connect(out);s.start(t,Math.random()*.5);s.stop(t+dur+.05);
  }
  /* ton: yumuşak vuruş ya da çınlama */
  function tone(t,dur,o){
    const os=ctx.createOscillator(),g=ctx.createGain();os.type=o.type||'sine';
    os.frequency.setValueAtTime(o.f,t);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(o.g,t+(o.a||.006));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    let n=os;if(o.lp){const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=o.lp;os.connect(f);n=f}
    n.connect(g);g.connect(out);os.start(t);os.stop(t+dur+.05);
  }
  /* ahşap/taş "tak": hem gövde hem tık */
  function clack(t,v,pitch){
    v=v||1;pitch=pitch||1;
    tone(t,.1,{f:210*pitch,to:95*pitch,g:.32*v,a:.002});
    nz(t,.06,{f:1500*pitch,q:.8,g:.34*v,a:.001});
    nz(t,.022,{f:3400,q:1.4,g:.12*v,a:.001});
  }
  const P={
    pick(t){nz(t,.035,{f:2600,q:1.2,g:.3,a:.002});tone(t,.05,{f:520,to:700,g:.06})},
    drop(t){clack(t,.8,1.1)},
    draw(t){nz(t,.13,{f:700,to:2600,q:.9,g:.16,a:.02});clack(t+.11,.3,1.3)},
    discard(t){clack(t,1,.9)},
    place(t,n){n=Math.max(1,Math.min(4,n||1));for(let i=0;i<n;i++)clack(t+i*.075,.7,1+(i%2)*.12)},
    open(t){for(let i=0;i<3;i++)clack(t+i*.07,.8,1+i*.1);tone(t+.24,.5,{f:392,g:.09,type:'triangle'});tone(t+.24,.5,{f:587,g:.07,type:'triangle'})},
    swap(t){tone(t,.3,{f:784,g:.13,type:'triangle'});tone(t+.1,.4,{f:1175,g:.12,type:'triangle'});nz(t,.05,{f:4200,q:2,g:.05})},
    turn(t){tone(t,.3,{f:659,g:.14,type:'triangle',lp:2600});tone(t+.1,.42,{f:880,g:.14,type:'triangle',lp:2600})},
    tick(t){tone(t,.04,{f:1300,g:.14,a:.002})},
    /* kanlı ceza: derin darbe, ıslak sıçrama, gergin ikili */
    penalty(t){
      tone(t,.7,{f:78,to:34,g:.62,a:.004});
      tone(t,.5,{f:58,to:38,g:.14,type:'sawtooth',lp:260});
      nz(t+.02,.42,{type:'lowpass',f:900,to:140,q:.7,g:.3,a:.01});
      nz(t+.05,.2,{f:2200,to:600,q:1.5,g:.07});
      tone(t+.05,.55,{f:220,g:.06,type:'triangle',lp:900});tone(t+.05,.55,{f:233,g:.06,type:'triangle',lp:900});
    },
    win(t){
      [523,659,784,1047].forEach((f,i)=>{tone(t+i*.11,.7,{f,g:.15,type:'triangle',lp:3200});tone(t+i*.11,.7,{f:f*2,g:.04})});
      tone(t+.46,.9,{f:1568,g:.05});tone(t+.5,1.1,{f:523,g:.1,type:'sine'});nz(t+.44,.35,{f:5000,q:3,g:.04});
    },
    lose(t){tone(t,.5,{f:392,g:.13,type:'triangle',lp:1500});tone(t+.2,.8,{f:294,g:.14,type:'triangle',lp:1200});tone(t+.2,.8,{f:147,g:.12})},
    deckend(t){tone(t,.6,{f:330,g:.12,type:'triangle',lp:1500});tone(t+.25,.7,{f:330,g:.1,type:'triangle',lp:1500})},
    deal(t){for(let i=0;i<14;i++)clack(t+i*.1+Math.random()*.03,.45+Math.random()*.25,.9+Math.random()*.4)},
    shuffle(t){
      nz(t,3.6,{type:'lowpass',f:260,q:.5,g:.2,a:.4});
      for(let i=0;i<34;i++){const x=t+Math.random()*3.4;nz(x,.05,{f:900+Math.random()*1800,q:1,g:.07+Math.random()*.1,a:.001});if(i%3===0)tone(x,.07,{f:150+Math.random()*90,to:90,g:.05,a:.002})}
    }
  };
  return{
    play(n,a){
      if(!snd||typeof document==='undefined'||document.hidden)return;
      const c=init();if(!c)return;
      try{
        const t=c.currentTime+.01;
        if(n==='place'&&BUF.place&&BUF.place.length){const k=Math.max(1,Math.min(4,a||1));for(let i=0;i<k;i++)samp(t+i*.08,'place');return}
        if(n==='shuffle'&&BUF.shuffle&&BUF.shuffle.length){samp(t,'shuffle');samp(t+2.1,'shuffle');return}
        if(samp(t,n))return;
        if(P[n])P[n](t,a);
      }catch(e){}
    },
    later(n,ms,a){setTimeout(()=>SFX.play(n,a),ms)},
    vib(p){if(!vb)return;buzz(p)},
    unlock(){if(snd)init()},
    loaded(){return Object.fromEntries(Object.entries(BUF).map(([k,v])=>[k,v.length]))},
    tick(sec){if(sec!==lastTick){lastTick=sec;SFX.play('tick');SFX.vib(30)}},
    get snd(){return snd},get vb(){return vb},
    setVol(v){VOL=[.35,.55,.8,1.15][v]||.8;if(sout)sout.gain.value=VOL},
    setSnd(v){snd=v;try{localStorage.setItem('ko_snd',v?'1':'0')}catch(e){}if(v){init();SFX.play('turn')}},
    setVib(v){vb=v;try{localStorage.setItem('ko_vib',v?'1':'0')}catch(e){}if(v)buzz([40,40,40])}
  };
})();
function syncTg(){const a=$('#sndT'),b=$('#vibT');if(a)a.setAttribute('aria-pressed',String(SFX.snd));if(b)b.setAttribute('aria-pressed',String(SFX.vb));document.querySelectorAll('[data-tg]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.tg==='snd'?SFX.snd:SFX.vb)))}
if(typeof document!=='undefined'&&typeof document.addEventListener==='function'){
  document.addEventListener('pointerdown',()=>SFX.unlock(),{passive:true});
  document.addEventListener('click',e=>{
    const m=e.target.closest&&e.target.closest('#menuT,#menuX');
    if(m||(e.target.classList&&e.target.classList.contains('xtra'))){const op=m&&m.id==='menuT'&&!document.body.classList.contains('menu-open');document.body.classList.toggle('menu-open',op);const mt=$('#menuT');if(mt)mt.setAttribute('aria-expanded',String(op));return}
    const t=e.target.closest&&e.target.closest('#sndT,#vibT,[data-tg]');if(!t)return;
    if(t.id==='sndT'||t.dataset.tg==='snd')SFX.setSnd(!SFX.snd);else SFX.setVib(!SFX.vb);syncTg()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('menu-open')){document.body.classList.remove('menu-open')}});
  syncTg();
}

  if(!drag||e.pointerId!==drag.pid)return;
  if(drag.raf){cancelAnimationFrame(drag.raf);drag.raf=0;if(drag.on)dragMoveNow(e)}
  const d=drag;drag=null;slotCache=null;
  const app=$('#app');app.classList.remove('dragging','candrop');
  const sc=$('#scene');if(sc)sc.classList.remove('hot');
  document.querySelectorAll('.rs.over,.rs.ibl,.rs.ibr').forEach(x=>x.classList.remove('over','ibl','ibr'));
  document.querySelectorAll('.mini.tgt,.mini.can').forEach(x=>x.classList.remove('tgt','can'));
  const rb=$('.rackbox');if(rb)rb.classList.remove('hot');
  if(d.ghost)d.ghost.remove();
  document.querySelectorAll('.pile.pulled').forEach(x=>x.classList.remove('pulled'));
  const fl=d.on&&d.kind==='rack'&&d.tgt&&!d.ins&&!d.disc?snapRects():null;
  pvClear(d);
  if(d.on){
    lastDrag=Date.now();
    const ok=e.type!=='pointercancel';
    if(d.kind!=='rack'){
      if(ok&&d.hot){
        dropAt=d.tgt?{...d.tgt,t:Date.now()}:null;
        pend=false;
        if(d.kind==='deck')drawDeck();else takeDisc();
        return;
      }
    }else if(ok){
      if(d.ins){pend=false;dropOnPer(d.ins.o,d.ins.gi,d.id,e.clientX,d.ins.jx);return}
      if(d.disc){
        if(canDiscard()){tryDiscard(d.id,'drag');return}
        msg='Taşı atmak için sıranın sende olması ve önce taş çekmiş olman gerekir.';
      }else if(d.tgt){flip=fl||snapRects();placeTile(d.id,d.tgt);SFX.play('drop')}
    }
  }
  if(d.on||pend){pend=false;render()}
}
